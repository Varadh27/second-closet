# Second Closet CI/CD pipeline
# Stages: Lint + Test -> Docker Build + Smoke Test -> Deploy (main only) -> Verify live site
# If any stage fails, every stage after it is skipped (because of "needs:").

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    name: 1. Lint and Test (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 .

      - name: Run tests with pytest
        run: pytest -v

  build:
    name: 2. Docker Build and Smoke Test
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t second-closet .

      - name: Start container and check /health
        run: |
          docker run -d -p 5000:5000 --name second-closet second-closet
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then
              echo ""
              echo "Container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy"
          docker logs second-closet
          exit 1

  deploy:
    name: 3. Deploy to Render (CD)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook for this exact commit
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}&ref=${{ github.sha }}"

  verify:
    name: 4. Verify Live Site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait until the live site reports the new commit
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          if [ -z "$LIVE_URL" ]; then
            echo "LIVE_URL repository variable is not set, skipping verification"
            exit 0
          fi
          EXPECTED="${GITHUB_SHA::7}"
          echo "Waiting for $LIVE_URL to serve commit $EXPECTED"
          for i in $(seq 1 40); do
            BODY=$(curl -fsS "$LIVE_URL/health" || true)
            echo "Attempt $i: $BODY"
            if echo "$BODY" | grep -q "$EXPECTED"; then
              echo "Live site is running commit $EXPECTED"
              exit 0
            fi
            sleep 15
          done
          echo "Live site did not update in time"
          exit 1
